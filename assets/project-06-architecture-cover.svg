<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <!-- Warm Alabaster Parchment Background -->
    <linearGradient id="arch-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F5F2EA"/>
      <stop offset="50%" stop-color="#EBE6DB"/>
      <stop offset="100%" stop-color="#E2DDD0"/>
    </linearGradient>

    <!-- Hard Shadow Filter -->
    <filter id="hard-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="6" dy="6" stdDeviation="0" flood-color="#16332B" flood-opacity="1"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1600" height="1000" fill="url(#arch-bg)"/>

  <!-- Architectural Gridlines -->
  <g fill="none" stroke="#16332B" stroke-opacity=".12" stroke-width="1.5" stroke-dasharray="6 6">
    <line x1="0" y1="200" x2="1600" y2="200"/>
    <line x1="0" y1="400" x2="1600" y2="400"/>
    <line x1="0" y1="600" x2="1600" y2="600"/>
    <line x1="0" y1="800" x2="1600" y2="800"/>
    <line x1="300" y1="0" x2="300" y2="1000"/>
    <line x1="600" y1="0" x2="600" y2="1000"/>
    <line x1="900" y1="0" x2="900" y2="1000"/>
    <line x1="1200" y1="0" x2="1200" y2="1000"/>
  </g>

  <!-- Hand-Sketched Architectural Structure (Shifted Far Right to Avoid Overlap) -->
  <g stroke="#16332B" stroke-width="3.5" fill="none">
    <!-- Ground Line -->
    <line x1="850" y1="750" x2="1550" y2="750" stroke-width="4"/>

    <!-- Tall Datum Pole -->
    <line x1="1280" y1="120" x2="1280" y2="750" stroke-width="5"/>

    <!-- Main Pole Cabin Structure -->
    <polygon points="1210,500 1280,410 1350,500" fill="#EBE6DB"/>
    <rect x="1220" y="500" width="120" height="100" fill="#FFF"/>
    <!-- Roof Hatching -->
    <line x1="1225" y1="500" x2="1275" y2="425" stroke-width="2"/>
    <line x1="1240" y1="500" x2="1280" y2="438" stroke-width="2"/>
    <line x1="1260" y1="500" x2="1285" y2="455" stroke-width="2"/>

    <!-- Support Stilts -->
    <line x1="1235" y1="600" x2="1235" y2="750" stroke-width="3"/>
    <line x1="1325" y1="600" x2="1325" y2="750" stroke-width="3"/>

    <!-- Secondary Small Structure -->
    <rect x="1420" y="650" width="80" height="100" fill="#FFF"/>
    <polygon points="1410,650 1460,600 1510,650" fill="#9E8256" stroke="#16332B" stroke-width="3"/>
  </g>

  <!-- Decorative Geometry Ring -->
  <circle cx="1340" cy="520" r="160" fill="none" stroke="#9E8256" stroke-opacity=".35" stroke-width="3.5" stroke-dasharray="10 10"/>

  <!-- Upper Left Pill Badge (Wide Pill so Text Never Overlaps) -->
  <g transform="translate(100, 180)" filter="url(#hard-shadow)">
    <rect x="0" y="0" width="370" height="50" rx="25" fill="#F4EFE4" stroke="#16332B" stroke-width="3"/>
    <text x="24" y="32" fill="#16332B" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="400" letter-spacing="1.5">✦ ARCHITECTURE &amp; LANDSCAPE</text>
  </g>

  <!-- Main Title (Clean 2-Line Layout on Left side with Zero Overlap) -->
  <text x="100" y="520" fill="#16332B" font-family="'Cormorant Garamond', 'Georgia', serif" font-size="86" font-weight="400" letter-spacing="1">Architectural</text>
  <text x="100" y="620" fill="#9E8256" font-family="'Cormorant Garamond', 'Georgia', serif" font-size="86" font-weight="400" font-style="italic" letter-spacing="1">Portfolio</text>

  <!-- Bottom Subtitle Banner Pill (Perfect Width) -->
  <g transform="translate(100, 720)" filter="url(#hard-shadow)">
    <rect x="0" y="0" width="700" height="52" rx="26" fill="#FFF" stroke="#16332B" stroke-width="3"/>
    <text x="24" y="34" fill="#16332B" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="400" letter-spacing="1.5">SELECTED WORKS · LANDSCAPE, ARCHITECTURE &amp; FINE ARTS</text>
  </g>
</svg>
