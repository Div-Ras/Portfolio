<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <!-- Cream Linen Page Background -->
    <linearGradient id="vr-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F7EDE2"/>
      <stop offset="50%" stop-color="#EFE3D5"/>
      <stop offset="100%" stop-color="#F7EDE2"/>
    </linearGradient>

    <!-- High Contrast Ink Offset Shadow -->
    <filter id="hard-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="6" dy="6" stdDeviation="0" flood-color="#1A2826" flood-opacity="1"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1600" height="1000" fill="url(#vr-bg)"/>

  <!-- Spatial Horizon & Grid Lines -->
  <g fill="none" stroke="#1A2826" stroke-opacity=".12" stroke-width="1.5" stroke-dasharray="6 6">
    <line x1="0" y1="200" x2="1600" y2="200"/>
    <line x1="0" y1="400" x2="1600" y2="400"/>
    <line x1="0" y1="600" x2="1600" y2="600"/>
    <line x1="0" y1="800" x2="1600" y2="800"/>
    <line x1="300" y1="0" x2="300" y2="1000"/>
    <line x1="600" y1="0" x2="600" y2="1000"/>
    <line x1="900" y1="0" x2="900" y2="1000"/>
    <line x1="1200" y1="0" x2="1200" y2="1000"/>
  </g>

  <!-- Concentric Spatial Ring Field (Right Side) -->
  <circle cx="1200" cy="440" r="300" fill="none" stroke="#84A59D" stroke-opacity=".25" stroke-width="2" stroke-dasharray="8 8"/>
  <circle cx="1200" cy="440" r="220" fill="none" stroke="#E6D7C3" stroke-width="2.5" stroke-dasharray="6 6"/>
  <circle cx="1200" cy="440" r="140" fill="none" stroke="#F5CAC3" stroke-width="3"/>

  <!-- Sleek Modern VR Headset Line Illustration (Shifted Right) -->
  <g filter="url(#hard-shadow)">
    <!-- VR Headset Enclosure -->
    <rect x="980" y="310" width="440" height="240" rx="36" fill="#FFFFFF" stroke="#1A2826" stroke-width="4"/>
    
    <!-- Visor Contour Line -->
    <path d="M 1040 450 C 1120 500, 1280 500, 1360 450" fill="none" stroke="#1A2826" stroke-width="4" stroke-linecap="round"/>

    <!-- Dual Optical Lenses -->
    <circle cx="1110" cy="400" r="48" fill="#F7EDE2" stroke="#1A2826" stroke-width="3.5"/>
    <circle cx="1290" cy="400" r="48" fill="#F7EDE2" stroke="#1A2826" stroke-width="3.5"/>
    
    <circle cx="1110" cy="400" r="26" fill="#84A59D"/>
    <circle cx="1290" cy="400" r="26" fill="#F5CAC3"/>

    <circle cx="1102" cy="392" r="8" fill="#FFFFFF"/>
    <circle cx="1282" cy="392" r="8" fill="#FFFFFF"/>

    <!-- Headset Straps -->
    <path d="M 980 400 C 930 400, 910 340, 950 310" fill="none" stroke="#1A2826" stroke-width="4" stroke-linecap="round"/>
    <path d="M 1420 400 C 1470 400, 1490 340, 1450 310" fill="none" stroke="#1A2826" stroke-width="4" stroke-linecap="round"/>

    <!-- Spatial Sensor Nodes -->
    <circle cx="1010" cy="340" r="7" fill="#1A2826"/>
    <circle cx="1390" cy="340" r="7" fill="#1A2826"/>
  </g>

  <!-- Interactive Floating Spatial Nodes -->
  <g filter="url(#hard-shadow)">
    <!-- Node 1: Sage -->
    <circle cx="920" cy="220" r="28" fill="#84A59D" stroke="#1A2826" stroke-width="3"/>
    <text x="920" y="226" fill="#1A2826" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800" text-anchor="middle">3D</text>

    <!-- Node 2: Beige -->
    <circle cx="1460" cy="240" r="32" fill="#E6D7C3" stroke="#1A2826" stroke-width="3"/>
    <text x="1460" y="246" fill="#1A2826" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800" text-anchor="middle">UX</text>

    <!-- Node 3: Pink -->
    <circle cx="890" cy="560" r="24" fill="#F5CAC3" stroke="#1A2826" stroke-width="3"/>
    <text x="890" y="565" fill="#1A2826" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="800" text-anchor="middle">XR</text>
  </g>

  <!-- Connecting Vector Rays -->
  <line x1="945" y1="235" x2="980" y2="330" stroke="#1A2826" stroke-width="2.5" stroke-dasharray="4 4"/>
  <line x1="1432" y1="258" x2="1420" y2="330" stroke="#1A2826" stroke-width="2.5" stroke-dasharray="4 4"/>
  <line x1="910" y1="545" x2="980" y2="480" stroke="#1A2826" stroke-width="2.5" stroke-dasharray="4 4"/>

  <!-- Top Pill Badge (Left Side) -->
  <g transform="translate(100, 180)" filter="url(#hard-shadow)">
    <rect x="0" y="0" width="340" height="50" rx="25" fill="#FFF" stroke="#1A2826" stroke-width="3"/>
    <text x="24" y="32" fill="#1A2826" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="800" letter-spacing="2">✦ SPATIAL UX &amp; MEDITATION</text>
  </g>

  <!-- Clean Title Layout on Left Side -->
  <text x="100" y="520" fill="#1A2826" font-family="'Fredoka', 'Playfair Display', serif" font-size="90" font-weight="700">Headspace VR</text>

  <!-- Bottom Subtitle Banner Pill (Positioned Cleanly at y=700 with Ample Clearance) -->
  <g transform="translate(100, 700)" filter="url(#hard-shadow)">
    <rect x="0" y="0" width="720" height="54" rx="27" fill="#84A59D" stroke="#1A2826" stroke-width="3"/>
    <text x="26" y="35" fill="#1A2826" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="800" letter-spacing="2">EXTENDED REALITY · SPATIAL DESIGN · META QUEST 3S</text>
  </g>
</svg>
