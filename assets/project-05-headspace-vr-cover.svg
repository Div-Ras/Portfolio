<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <!-- Tactile Cream Background -->
    <linearGradient id="vr-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F9F6F0"/>
      <stop offset="100%" stop-color="#F2EDE4"/>
    </linearGradient>

    <!-- Illustrative Hard Shadow Filter -->
    <filter id="hard-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="6" dy="6" stdDeviation="0" flood-color="#162238" flood-opacity="1"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1600" height="1000" fill="url(#vr-bg)"/>

  <!-- Illustrative Hand-Sketched Grid Lines -->
  <g fill="none" stroke="#162238" stroke-opacity=".1" stroke-width="2" stroke-dasharray="8 8">
    <line x1="0" y1="200" x2="1600" y2="200"/>
    <line x1="0" y1="400" x2="1600" y2="400"/>
    <line x1="0" y1="600" x2="1600" y2="600"/>
    <line x1="0" y1="800" x2="1600" y2="800"/>
    <line x1="300" y1="0" x2="300" y2="1000"/>
    <line x1="600" y1="0" x2="600" y2="1000"/>
    <line x1="900" y1="0" x2="900" y2="1000"/>
    <line x1="1200" y1="0" x2="1200" y2="1000"/>
  </g>

  <!-- Illustrative VR Headset Doodle Frame (Cute & Ballsy) -->
  <g filter="url(#hard-shadow)">
    <!-- VR Headset Body -->
    <rect x="920" y="240" width="460" height="260" rx="40" fill="#FFFFFF" stroke="#162238" stroke-width="5"/>
    <path d="M 980 370 C 1040 430, 1260 430, 1320 370" fill="none" stroke="#162238" stroke-width="5" stroke-linecap="round"/>

    <!-- Dual VR Lenses -->
    <circle cx="1060" cy="330" r="45" fill="#E4ECE3" stroke="#162238" stroke-width="4"/>
    <circle cx="1240" cy="330" r="45" fill="#F8E5DF" stroke="#162238" stroke-width="4"/>
    <circle cx="1060" cy="330" r="20" fill="#1B2E4B"/>
    <circle cx="1240" cy="330" r="20" fill="#D47455"/>

    <!-- Headset Strap -->
    <path d="M 920 330 C 860 330, 840 280, 880 240" fill="none" stroke="#162238" stroke-width="5" stroke-linecap="round"/>
    <path d="M 1380 330 C 1440 330, 1460 280, 1420 240" fill="none" stroke="#162238" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Cute Illustrative 3D Trees & Nature Doodles (Sage & Terracotta) -->
  <!-- Tree 1 -->
  <g filter="url(#hard-shadow)">
    <path d="M 780 580 L 820 460 L 860 580 Z" fill="#52735B" stroke="#162238" stroke-width="4"/>
    <path d="M 790 520 L 820 420 L 850 520 Z" fill="#749B7E" stroke="#162238" stroke-width="4"/>
    <rect x="812" y="580" width="16" height="50" rx="4" fill="#162238"/>
  </g>

  <!-- Tree 2 -->
  <g filter="url(#hard-shadow)">
    <circle cx="1000" cy="540" r="55" fill="#D47455" stroke="#162238" stroke-width="4"/>
    <circle cx="980" cy="520" r="35" fill="#E88B6D" opacity=".6"/>
    <rect x="992" y="595" width="16" height="55" rx="4" fill="#162238"/>
  </g>

  <!-- Tree 3 -->
  <g filter="url(#hard-shadow)">
    <path d="M 1160 590 C 1140 480, 1240 480, 1220 590 Z" fill="#8A9BE8" stroke="#162238" stroke-width="4"/>
    <rect x="1182" y="590" width="16" height="45" rx="4" fill="#162238"/>
  </g>

  <!-- Hand-Drawn Wavy Ground -->
  <path d="M 700 630 Q 950 660, 1200 630 T 1450 630" fill="none" stroke="#162238" stroke-width="5" stroke-linecap="round"/>

  <!-- Cute Hand-Drawn Stickers & Doodles -->
  <!-- Flower Sticker -->
  <g transform="translate(740, 260)" filter="url(#hard-shadow)">
    <rect x="0" y="0" width="120" height="44" rx="22" fill="#F8E5DF" stroke="#162238" stroke-width="3"/>
    <text x="18" y="28" fill="#162238" font-family="'Inter', sans-serif" font-size="16" font-weight="700">✿ CREATIVE</text>
  </g>

  <!-- Spatial Sparkle Sticker -->
  <g transform="translate(1320, 180)" filter="url(#hard-shadow)">
    <rect x="0" y="0" width="130" height="44" rx="22" fill="#E4ECE3" stroke="#162238" stroke-width="3"/>
    <text x="18" y="28" fill="#162238" font-family="'Inter', sans-serif" font-size="16" font-weight="700">✦ SPATIAL VR</text>
  </g>

  <!-- Hand-drawn Doodle Stars & Swirls -->
  <text x="730" y="420" fill="#D47455" font-size="36">✹</text>
  <text x="1420" y="480" fill="#52735B" font-size="42">✦</text>
  <text x="1100" y="190" fill="#1B2E4B" font-size="32">⚡</text>

  <!-- Hand-drawn Wavy Underline Ribbon for Title -->
  <path d="M 120 780 Q 400 800, 680 780" fill="none" stroke="#D47455" stroke-width="6" stroke-linecap="round"/>

  <!-- Main Title in Bodoni Moda / Serif with Ink Shadow -->
  <text x="120" y="740" fill="#162238" font-family="'Bodoni Moda', 'Georgia', serif" font-size="92" font-weight="700">Headspace VR</text>

  <!-- Subtitle Pill Tag -->
  <g transform="translate(120, 810)" filter="url(#hard-shadow)">
    <rect x="0" y="0" width="760" height="52" rx="26" fill="#FFF" stroke="#162238" stroke-width="3"/>
    <text x="24" y="34" fill="#162238" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="700" letter-spacing="3">DECO7230 · EXTENDED REALITY UX · META QUEST 3S</text>
  </g>
</svg>
